[install]
# Single-package app. Use "isolated" if strict dependency isolation is preferred.
linker = "hoisted"
# Supply-chain guard: skip versions published less than 3 days ago.
minimumReleaseAge = "3d"

[fmt]
printWidth = 100
sortImports = true
sortTailwindcss = true
sortPackageJson = true
# JSDoc blocks are formatter-owned, like sortImports: the same mechanical
# standard as CS1591 XML docs on the .NET side (see bun.com/docs/format).
jsdoc = true
